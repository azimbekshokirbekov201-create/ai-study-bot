[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-study-bot"
version = "1.0.0"
description = "Uzbek and English Telegram education platform"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.24,<4", "SQLAlchemy[asyncio]>=2.0.38,<2.1",
  "asyncpg>=0.30,<1", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "fastapi>=0.121,<1", "uvicorn[standard]>=0.34,<1",
  "openai>=1.65,<3", "redis>=5.2,<7", "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "aiosqlite>=0.20,<1", "ruff>=0.11,<1", "coverage>=7.6,<8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["error", "ignore::DeprecationWarning:aiogram.*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/telegram.py" = ["ASYNC109"]  # Required aiogram abstract method signatures.
